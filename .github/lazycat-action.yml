version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: cftun-ui
    bump: patch

build:
  toolchains: []
  run_buildscript: false

images:
  - id: cftun-ui
    target: service
    service: cftun-ui
    source: docker.io/uxiaohan/cftun-ui
    channel: custom
    sort: created
    tag_regex: '^latest$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: CFTun-UI
    summary: Cloudflare Tunnel 自托管管理面板
