application:
  subdomain: cftun-ui
  multi_instance: false
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://cftun-ui:9911/
  injects:
    # 三阶段免密登录：首次注册/登录捕获凭据，之后自动填充
    - id: capture-credentials
      on: request
      auth_required: false
      when:
        - /api/login
        - /api/register
        - /api/auth
      do: |
        const payload = ctx.body.getJSON();
        const user = payload && (payload.username || payload.user || payload.account);
        if (user && payload.password) {
          ctx.flow.set("pending_user", String(user));
          ctx.flow.set("pending_pass", String(payload.password));
        }
    - id: persist-credentials
      on: response
      auth_required: false
      when:
        - /api/login
        - /api/register
        - /api/auth
      do: |
        if (ctx.status >= 200 && ctx.status < 300) {
          const user = ctx.flow.get("pending_user");
          const pass = ctx.flow.get("pending_pass");
          if (user && pass) {
            ctx.persist.set("saved_user", user);
            ctx.persist.set("saved_pass", pass);
          }
        }
    - id: autofill-login
      when:
        - /
      do:
        - src: builtin://simple-inject-password
          params:
            user:
              $persist: saved_user
            password:
              $persist: saved_pass

services:
  cftun-ui:
    # upstream: docker.io/uxiaohan/cftun-ui:2026.09.20_17.19
    image: docker.1ms.run/uxiaohan/cftun-ui:2026.09.20_17.19
    # 需要管理本机 cloudflared 进程与访问局域网服务，走宿主网络
    network_mode: host
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=9911
      - DATA_DIR=/data
      - NO_AUTH_RUN=0
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9911/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    binds:
      - /lzcapp/var/data:/data

usage: |
  CFTun-UI 是 Cloudflare Tunnel 管理面板：同步远端 Ingress、维护 DNS、独立管理 cloudflared 生命周期。
  首次打开注册管理账号（免密登录会记住首次凭据）。使用需自备 Cloudflare 账号、API Token 与已创建的 Tunnel。
  应用使用宿主网络（管理本机 cloudflared 进程），端口 9911。
